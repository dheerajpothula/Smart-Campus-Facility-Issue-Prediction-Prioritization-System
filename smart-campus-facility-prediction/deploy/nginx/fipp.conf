# ==============================================================================
# FIPP — Campus Nginx Reverse Proxy Configuration (deploy/nginx/fipp.conf)
# Place in /etc/nginx/sites-available/fipp.conf and symlink to sites-enabled/
# ==============================================================================

# Rate limiting zone: 10 requests per second per IP address
limit_req_zone $binary_remote_addr zone=fipp_rate_limit:10m rate=10r/s;

# Upstream Streamlit application server
upstream fipp_backend {
    server 127.0.0.1:8501;
    keepalive 32;
}

# HTTP Server — Redirect all unencrypted traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fipp.campus.edu facility.campus.edu;

    # ACME / Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server — Production SSL/TLS Termination
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fipp.campus.edu facility.campus.edu;

    # TLS Certificates (Provided by University IT or Certbot)
    ssl_certificate /etc/ssl/certs/fipp_campus.crt;
    ssl_certificate_key /etc/ssl/private/fipp_campus.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum file upload size (matches Streamlit maxUploadSize = 10MB)
    client_max_body_size 10M;

    # Streamlit Core WebSocket & Static Asset Proxy
    location / {
        limit_req zone=fipp_rate_limit burst=20 nodelay;

        proxy_pass http://fipp_backend;
        proxy_http_version 1.1;

        # Mandatory headers for Streamlit WebSocket connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Client identity and proxy forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for interactive long-lived sessions
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # Health check endpoint bypass (for campus monitoring / uptime checks)
    location /_stcore/health {
        proxy_pass http://fipp_backend/_stcore/health;
        access_log off;
    }
}
